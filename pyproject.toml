[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-framework"
version = "0.1.0"
description = "Local AI Code Intelligence Platform"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires live Qdrant and Ollama (skip with -m 'not integration')",
]